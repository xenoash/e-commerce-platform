[project]
name = "ecommerce-platform"
version = "0.1.0"
description = "Multi-tenant cart API: tenant isolation, pluggable payments and upsell, ZATCA e-invoicing"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "cryptography>=50.0.2",
    "django==6.1.2",
    "django-redis>=7.0.0",
    "djangorestframework==3.18.3",
    "drf-spectacular==0.30.0",
    "gunicorn>=26.2.0",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "hypothesis>=6.169.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-xdist>=3.8.0",
    "responses>=0.26.3",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["apps/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF"]
ignore = ["RUF012", "B904", "DJ001", "DJ012", "RUF001", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"apps/invoicing/zatca/signing.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--reuse-db -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:celery.*"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "*/management/commands/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
