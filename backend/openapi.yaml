openapi: 3.0.3
info:
  title: E-commerce Platform Cart API
  version: 1.0.0
  description: Multi-tenant storefront cart API. Every request names its store in
    the `X-Store` header. Errors are RFC 9457 problem documents with a stable `code`.
paths:
  /api/v1/auth/token:
    post:
      operationId: createToken
      summary: Sign in and get a store-scoped bearer token
      parameters:
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Wrong email or password for this store.
  /api/v1/carts:
    post:
      operationId: createCart
      description: Signed-in customers get their active cart back (200) or a new one
        (201). Guests always get a new cart and a one-time `cart_token`.
      summary: Open a cart
      parameters:
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      tags:
      - Carts
      security:
      - customerToken: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedCart'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedCart'
          description: ''
  /api/v1/carts/{cart_id}:
    get:
      operationId: getCart
      summary: Get a cart with live prices, warnings and checkout readiness
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Secret returned when a guest cart is created. Not needed for
          signed-in customers.
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      - in: path
        name: cart_id
        schema:
          type: string
        required: true
      tags:
      - Carts
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Cart not found, or it belongs to another customer or store.
  /api/v1/carts/{cart_id}/billing-address:
    put:
      operationId: setBillingAddress
      summary: Set the billing address; a VAT number makes the invoice a standard
        (B2B) tax invoice
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: Cart version from the last read (ETag), for example "7". A stale
          version returns 412.
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Secret returned when a guest cart is created. Not needed for
          signed-in customers.
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      - in: path
        name: cart_id
        schema:
          type: string
        required: true
      tags:
      - Carts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingAddressRequest'
        required: true
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Cart not found, or it belongs to another customer or store.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The cart is not open, or the change conflicts with stock.
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: If-Match did not match the current cart version.
  /api/v1/carts/{cart_id}/checkout:
    post:
      operationId: checkoutCart
      description: Creates an order and charges the chosen payment method. Returns
        201 with the order. When `payment.next_action` is present, send the shopper
        there (3-D Secure), then call `POST /orders/{id}/payment/confirm`. Retrying
        with the same Idempotency-Key replays the result.
      summary: Place the order and start payment
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Unique per checkout attempt. Retrying with the same key never
          creates a second order.
        required: true
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Secret returned when a guest cart is created. Not needed for
          signed-in customers.
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      - in: path
        name: cart_id
        schema:
          type: string
        required: true
      tags:
      - Checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      security:
      - customerToken: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Cart not ready, total changed, out of stock, coupon no longer
            applies, or request in progress.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Payment token missing, method not allowed, or Idempotency-Key
            reused with another body.
        '428':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Idempotency-Key header missing.
  /api/v1/carts/{cart_id}/coupon:
    put:
      operationId: applyCoupon
      summary: Apply a coupon (replaces any applied coupon)
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: Cart version from the last read (ETag), for example "7". A stale
          version returns 412.
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Secret returned when a guest cart is created. Not needed for
          signed-in customers.
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      - in: path
        name: cart_id
        schema:
          type: string
        required: true
      tags:
      - Carts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyCouponRequest'
        required: true
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unknown coupon or a failed constraint.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Cart not found, or it belongs to another customer or store.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The cart is not open, or the change conflicts with stock.
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: If-Match did not match the current cart version.
    delete:
      operationId: removeCoupon
      summary: Remove the coupon (no-op when none is applied)
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: Cart version from the last read (ETag), for example "7". A stale
          version returns 412.
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Secret returned when a guest cart is created. Not needed for
          signed-in customers.
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      - in: path
        name: cart_id
        schema:
          type: string
        required: true
      tags:
      - Carts
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Cart not found, or it belongs to another customer or store.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The cart is not open, or the change conflicts with stock.
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: If-Match did not match the current cart version.
  /api/v1/carts/{cart_id}/items:
    post:
      operationId: addCartItem
      summary: Add a product (merges into the existing line)
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: Cart version from the last read (ETag), for example "7". A stale
          version returns 412.
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Secret returned when a guest cart is created. Not needed for
          signed-in customers.
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      - in: path
        name: cart_id
        schema:
          type: string
        required: true
      tags:
      - Carts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
        required: true
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unknown product or quantity limit.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Cart not found, or it belongs to another customer or store.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The cart is not open, or the change conflicts with stock.
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: If-Match did not match the current cart version.
  /api/v1/carts/{cart_id}/items/{item_id}:
    patch:
      operationId: updateCartItem
      summary: Change a line's quantity
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: Cart version from the last read (ETag), for example "7". A stale
          version returns 412.
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Secret returned when a guest cart is created. Not needed for
          signed-in customers.
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      - in: path
        name: cart_id
        schema:
          type: string
        required: true
      - in: path
        name: item_id
        schema:
          type: string
        required: true
      tags:
      - Carts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateItemRequest'
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Cart not found, or it belongs to another customer or store.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The cart is not open, or the change conflicts with stock.
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: If-Match did not match the current cart version.
    delete:
      operationId: removeCartItem
      summary: Remove a product
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: Cart version from the last read (ETag), for example "7". A stale
          version returns 412.
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Secret returned when a guest cart is created. Not needed for
          signed-in customers.
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      - in: path
        name: cart_id
        schema:
          type: string
        required: true
      - in: path
        name: item_id
        schema:
          type: string
        required: true
      tags:
      - Carts
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Cart not found, or it belongs to another customer or store.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The cart is not open, or the change conflicts with stock.
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: If-Match did not match the current cart version.
  /api/v1/carts/{cart_id}/payment-method:
    put:
      operationId: setPaymentMethod
      summary: Choose how to pay (the card token is sent at checkout, never stored
        on the cart)
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: Cart version from the last read (ETag), for example "7". A stale
          version returns 412.
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Secret returned when a guest cart is created. Not needed for
          signed-in customers.
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      - in: path
        name: cart_id
        schema:
          type: string
        required: true
      tags:
      - Carts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodChoiceRequest'
        required: true
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not offered or not allowed for this customer.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Cart not found, or it belongs to another customer or store.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The cart is not open, or the change conflicts with stock.
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: If-Match did not match the current cart version.
  /api/v1/carts/{cart_id}/shipping-address:
    put:
      operationId: setShippingAddress
      summary: Set the delivery address (Saudi national address)
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: Cart version from the last read (ETag), for example "7". A stale
          version returns 412.
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Secret returned when a guest cart is created. Not needed for
          signed-in customers.
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      - in: path
        name: cart_id
        schema:
          type: string
        required: true
      tags:
      - Carts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Cart not found, or it belongs to another customer or store.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The cart is not open, or the change conflicts with stock.
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: If-Match did not match the current cart version.
  /api/v1/carts/{cart_id}/suggestions:
    get:
      operationId: listCartSuggestions
      summary: Upsell and cross-sell suggestions for this cart
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Secret returned when a guest cart is created. Not needed for
          signed-in customers.
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      - in: path
        name: cart_id
        schema:
          type: string
        required: true
      tags:
      - Carts
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionList'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Cart not found, or it belongs to another customer or store.
  /api/v1/me:
    get:
      operationId: getMe
      summary: The signed-in customer
      parameters:
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      tags:
      - Auth
      security:
      - customerToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/orders:
    get:
      operationId: listOrders
      summary: The signed-in customer's orders
      parameters:
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      tags:
      - Orders
      security:
      - customerToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/orders/{order_id}:
    get:
      operationId: getOrder
      summary: Get an order with its payment and invoice status
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Secret returned when a guest cart is created. Not needed for
          signed-in customers.
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      - in: path
        name: order_id
        schema:
          type: string
        required: true
      tags:
      - Orders
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Order not found.
  /api/v1/orders/{order_id}/invoice:
    get:
      operationId: getOrderInvoice
      summary: The order's ZATCA tax invoice (JSON with QR payload, or ?format=xml
        for the signed UBL)
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Secret returned when a guest cart is created. Not needed for
          signed-in customers.
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - xml
      - in: path
        name: order_id
        schema:
          type: string
        required: true
      tags:
      - Orders
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Order not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invoice not issued or not cleared yet.
  /api/v1/orders/{order_id}/payment/confirm:
    post:
      operationId: confirmOrderPayment
      summary: Re-check payment with the gateway after a redirect (safe to call repeatedly)
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Secret returned when a guest cart is created. Not needed for
          signed-in customers.
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      - in: path
        name: order_id
        schema:
          type: string
        required: true
      tags:
      - Orders
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Order not found.
  /api/v1/payment-methods:
    get:
      operationId: listPaymentMethods
      summary: Payment methods this store accepts
      parameters:
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      tags:
      - Store
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethod'
          description: ''
  /api/v1/products:
    get:
      operationId: listProducts
      summary: Browse the store's catalogue
      parameters:
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - digital
          - physical
          - service
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search by name or SKU.
      tags:
      - Catalogue
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
          description: ''
  /api/v1/products/{product_id}:
    get:
      operationId: getProduct
      summary: Get one product
      parameters:
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Catalogue
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Product not found in this store.
  /api/v1/store:
    get:
      operationId: getStore
      summary: Public settings of the current store
      parameters:
      - in: header
        name: X-Store
        schema:
          type: string
        description: Handle of the store (tenant) this request is for.
        required: true
      tags:
      - Store
      security:
      - customerToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
          description: ''
  /api/v1/webhooks/payments/{gateway}/{store}:
    post:
      operationId: receivePaymentWebhook
      summary: Gateway callback. Signature-verified with the store's secret; duplicates
        are no-ops.
      parameters:
      - in: path
        name: gateway
        schema:
          type: string
        required: true
      - in: path
        name: store
        schema:
          type: string
        required: true
      tags:
      - Webhooks
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Signature invalid.
